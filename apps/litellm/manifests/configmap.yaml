apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm
data:
  config.yaml: |
    model_list:
      # ── Cloudflare Workers AI ─────────────────────────────────────────────
      # Credentials injected via litellm-secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_API_BASE)
      - model_name: cf/llama-3.1-8b-instruct
        litellm_params:
          model: openai/@cf/meta/llama-3.1-8b-instruct
          api_key: os.environ/CLOUDFLARE_API_TOKEN
          api_base: os.environ/CLOUDFLARE_API_BASE

      # ── Ollama ────────────────────────────────────────────────────────────
      - model_name: qwen3:4b
        litellm_params:
          model: ollama/qwen3:4b
          api_base: http://ollama.llm.svc.cluster.local:11434

      - model_name: qwen3:8b
        litellm_params:
          model: ollama/qwen3:8b
          api_base: http://ollama.llm.svc.cluster.local:11434

    router_settings:
      routing_strategy: simple-shuffle

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/LITELLM_DATABASE_URL
