apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm
type: Opaque
stringData:
  # Master key — used to authenticate all proxy API calls and to log into /ui.
  # Apply the real value with:
  #   kubectl create secret generic litellm-secrets -n llm \
  #     --from-literal=LITELLM_MASTER_KEY=sk-... \
  #     --from-literal=CLOUDFLARE_API_TOKEN=... \
  #     --from-literal=CLOUDFLARE_API_BASE=... \
  #     --from-literal=LITELLM_DATABASE_URL=... \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #
  # Consuming services (e.g. mywallet) must set their LITELLM_API_KEY to
  # the same value as LITELLM_MASTER_KEY.
  LITELLM_MASTER_KEY: "REPLACE-ME"

  # Cloudflare Workers AI
  # API token: dash.cloudflare.com → My Profile → API Tokens
  # apiBase: https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/ai/v1
  CLOUDFLARE_API_TOKEN: "REPLACE-ME"
  CLOUDFLARE_API_BASE: "REPLACE-ME"

  # Supabase PostgreSQL — enables LiteLLM /ui dashboard and spend tracking
  LITELLM_DATABASE_URL: "REPLACE-ME"
