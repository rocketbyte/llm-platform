apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm
type: Opaque
stringData:
  # Master key used to log into the LiteLLM admin UI at /ui
  # and as the bearer token for all proxy API calls.
  # Change this to something strong before deploying.
  LITELLM_MASTER_KEY: "sk-litellm-admin"
